[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "fastprox"
dynamic = ["version"]
description = "Exact proximal operators and projections with derivatives"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]
authors = [{ name = "David Villacís", email = "david@villacis.net" }]
keywords = ["proximal operator", "projection", "total variation", "optimization", "bilevel", "autodiff"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/dvillacis/fastprox"
Documentation = "https://dvillacis.github.io/fastprox/"
Changelog = "https://github.com/dvillacis/fastprox/blob/master/CHANGELOG.md"
Issues = "https://github.com/dvillacis/fastprox/issues"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "cmake>=3.20", "ninja"]
examples = [
    "matplotlib>=3.11.2",
]
ref = [
    "clarabel>=0.11.1",
    "cvxpy>=1.9.3",
]
interop = ["torch>=2.4", "jax>=0.4.34", "pyproximal>=0.10"]
# The documentation site (mkdocs.yml); mkdocstrings reads the package statically.
# MkDocs 2 drops the plugins Material and mkdocstrings need.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["bindings/python/fastprox"]
cmake.build-type = "Release"

# One version for the C core and the Python package: CMakeLists.txt project().
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '''(?s)project\(fastprox VERSION (?P<value>[0-9][0-9.]*).*?FASTPROX_VERSION_SUFFIX "(?P<suffix>[^"]*)"'''
result = "{value}{suffix}"

[tool.scikit-build.cmake.define]
FASTPROX_PYTHON = "ON"
FASTPROX_BUILD_TESTS = "OFF"

# PyTorch's CPU wheels on Linux: the PyPI ones pull in the CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.uv]
# Rebuild the extension whenever the C++ sources change.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "include/**/*.h" },
  { file = "src/**/*.[ch]pp" },
  { file = "bindings/python/**/*.cpp" },
  { file = "bindings/python/**/*.txt" },
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.cibuildwheel]
# abi3 wheels: one build per platform covers CPython >= 3.12.
build = "cp312-*"
skip = ["*-musllinux_*", "*-win32"]  # 64-bit Windows only (spec Section 12)
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-requires = ["pytest", "hypothesis"]
test-command = "pytest -q {project}/tests/python"

[[tool.cibuildwheel.overrides]]
# C++17 aligned allocation needs macOS 10.14 at run time; arm64 starts at 11.0.
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.windows]
# Bundle any DLL the extension needs beyond Windows and the CPython install,
# as delocate and auditwheel do on macOS and Linux.
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
