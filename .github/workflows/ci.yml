name: ci

on:
  push:
  pull_request:
  workflow_dispatch:  # also builds the wheels, without a tag

jobs:
  c:
    name: C/C++ ${{ matrix.os }} ${{ matrix.cc }} openmp=${{ matrix.openmp }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc, cxx: g++, openmp: ON }
          - { os: ubuntu-latest, cc: clang, cxx: clang++, openmp: ON }
          - { os: ubuntu-latest, cc: gcc, cxx: g++, openmp: OFF }
          - { os: macos-latest, cc: clang, cxx: clang++, openmp: ON }
          - { os: macos-15-intel, cc: clang, cxx: clang++, openmp: ON }
          - { os: windows-latest, cc: cl, cxx: cl, openmp: ON }
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'macOS'
        run: brew install libomp
      - name: Configure
        env: { CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}" }
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFASTPROX_OPENMP=${{ matrix.openmp }}
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure --timeout 300

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFASTPROX_SANITIZE=ON -DFASTPROX_OPENMP=OFF -DFASTPROX_FUZZ=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --timeout 300

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFASTPROX_OPENMP=OFF
      - run: cmake --build build
      - name: Memcheck
        run: |
          for t in build/tests/c/test_header build/tests/c/test_core; do
            valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite "$t"
          done

  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'macOS'
        run: brew install libomp
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run pytest -q

  wheels:
    name: Wheels ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macOS runners are pinned: the wheel's minimum macOS is that of the
        # runner's Homebrew libomp, which must match MACOSX_DEPLOYMENT_TARGET.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
