name: ci

on:
  push:
  pull_request:
  workflow_dispatch:  # also builds the wheels, without a tag
    inputs:
      publish:
        description: Upload the wheels and sdist to TestPyPI
        type: boolean
        default: false

jobs:
  c:
    name: C/C++ ${{ matrix.os }} ${{ matrix.cc }} openmp=${{ matrix.openmp }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc, cxx: g++, openmp: ON }
          - { os: ubuntu-latest, cc: clang, cxx: clang++, openmp: ON }
          - { os: ubuntu-latest, cc: gcc, cxx: g++, openmp: OFF }
          - { os: macos-latest, cc: clang, cxx: clang++, openmp: ON }
          - { os: macos-15-intel, cc: clang, cxx: clang++, openmp: ON }
          - { os: windows-latest, cc: cl, cxx: cl, openmp: ON }
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'macOS'
        run: brew install libomp
      - name: Configure
        env: { CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}" }
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFASTPROX_OPENMP=${{ matrix.openmp }}
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure --timeout 300

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFASTPROX_SANITIZE=ON -DFASTPROX_OPENMP=OFF -DFASTPROX_FUZZ=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --timeout 300

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFASTPROX_OPENMP=OFF
      - run: cmake --build build
      - name: Memcheck
        run: |
          for t in build/tests/c/test_header build/tests/c/test_core; do
            valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite "$t"
          done

  python:
    name: Python ${{ matrix.python }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - { os: ubuntu-latest, python: "3.14" }  # the abi3 wheel on a newer CPython
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'macOS'
        run: brew install libomp
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest -q

  wheels:
    name: Wheels ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macOS runners are pinned: the wheel's minimum macOS is that of the
        # runner's Homebrew libomp, which must match MACOSX_DEPLOYMENT_TARGET.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --sdist
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(tar xzf dist/*.tar.gz -O --wildcards '*/PKG-INFO' | sed -n 's/^Version: //p')
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Trusted publishing (OIDC): no API tokens are stored in the repository.
  # The publishers are registered on PyPI and TestPyPI for this workflow file
  # and these environment names.
  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [c, sanitizers, valgrind, python, wheels, sdist]
    runs-on: ubuntu-latest
    environment: { name: testpypi, url: "https://test.pypi.org/p/fastprox" }
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { repository-url: "https://test.pypi.org/legacy/" }

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [c, sanitizers, valgrind, python, wheels, sdist]
    runs-on: ubuntu-latest
    environment: { name: pypi, url: "https://pypi.org/p/fastprox" }
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
