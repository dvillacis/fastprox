name: ci

on:
  # Pushes to master and release tags (a v* tag publishes to PyPI); other
  # branches run through their pull request, so a push does not run twice.
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:  # also builds the wheels, without a tag
    inputs:
      publish:
        description: Upload the wheels and sdist to TestPyPI
        type: boolean
        default: false

# A new push to a pull request cancels its older runs.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  c:
    name: C/C++ ${{ matrix.os }} ${{ matrix.cc }} threads=${{ matrix.threads }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc, cxx: g++, threads: ON }
          - { os: ubuntu-latest, cc: clang, cxx: clang++, threads: ON }
          - { os: ubuntu-latest, cc: gcc, cxx: g++, threads: OFF }
          - { os: macos-latest, cc: clang, cxx: clang++, threads: ON }
          - { os: macos-15-intel, cc: clang, cxx: clang++, threads: ON }
          - { os: windows-latest, cc: cl, cxx: cl, threads: ON }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env: { CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}" }
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFASTPROX_THREADS=${{ matrix.threads }}
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure --timeout 300
      # The kernel profiler (bench/profile_kernels.cpp) builds, and its core
      # section runs (audit C11). POSIX only: it loads proxTV with dlopen.
      - name: Profiler
        if: runner.os != 'Windows'
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra bench/profile_kernels.cpp src/core/parallel.cpp -Iinclude -Isrc \
            -Lbuild -lfastprox -ldl -pthread -Wl,-rpath,build -o build/profile_kernels
          build/profile_kernels core elem

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFASTPROX_SANITIZE=ON -DFASTPROX_FUZZ=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --timeout 300

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TSan in clang 18 rejects the runner kernel's high ASLR entropy.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        env: { CC: clang, CXX: clang++ }
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_FLAGS=-fsanitize=thread -DCMAKE_CXX_FLAGS=-fsanitize=thread
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --timeout 300
        env: { TSAN_OPTIONS: "halt_on_error=1" }

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # valgrind's packages from the Actions cache: the Azure mirror served them
      # at 36-45 kB/s on some runs (8-9 minutes for 22 MB). On a miss they are
      # downloaded (the image's package index usually has them; refreshed only
      # if not) and cached for the next run.
      - uses: actions/cache@v4
        with:
          path: ~/valgrind-debs
          key: valgrind-debs-${{ runner.os }}-${{ runner.arch }}-noble-v1
      - name: Install valgrind
        run: |
          if ls ~/valgrind-debs/*.deb >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ~/valgrind-debs/*.deb
          else
            sudo apt-get install -y --no-install-recommends valgrind ||
              { sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind; }
            mkdir -p ~/valgrind-debs
            cp /var/cache/apt/archives/valgrind_*.deb /var/cache/apt/archives/libc6-dbg_*.deb ~/valgrind-debs/ || true
          fi
      # -O1 -g, as valgrind's manual advises: its reports stay accurate, and
      # the run is several times faster than -O0 under memcheck's slowdown.
      - run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O1 -g" -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g"
      - run: cmake --build build
      - name: Memcheck
        env: { FASTPROX_TEST_LIGHT: "1" }  # throughput-sized tests small, no fork stress
        run: |
          for t in build/tests/c/test_header build/tests/c/test_core build/tests/c/test_maxflow build/tests/c/test_eibfs; do
            valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite \
              --suppressions=tests/valgrind/fork.supp "$t"
          done

  # The C ABI against the last release (rc tags excluded): functions may be
  # added, nothing may change or go. libabigail compares the two libraries'
  # DWARF, limited to the types of the public header.
  abi:
    name: ABI against the last release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo apt-get update && sudo apt-get install -y abigail-tools
      - name: Baseline
        run: |
          # From HEAD^, so a run on a release tag compares with the one before.
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*rc*' HEAD^)
          echo "Baseline: $base"
          git worktree add ../base "$base"
      - name: Build both
        run: |
          for d in ../base .; do
            cmake -S $d -B $d/build/abi -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFASTPROX_BUILD_TESTS=OFF
            cmake --build $d/build/abi
          done
      - name: abidiff
        run: >
          abidiff --no-added-syms --ignore-soname
          --headers-dir1 ../base/include --headers-dir2 include
          ../base/build/abi/libfastprox.so build/abi/libfastprox.so

  python:
    name: Python ${{ matrix.python }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - { os: ubuntu-latest, python: "3.14" }  # the abi3 wheel on a newer CPython
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest -q

  interop:
    name: PyTorch and JAX ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group interop
      - run: uv run --group interop pytest -q tests/python/test_torch.py tests/python/test_jax.py tests/python/test_device_tv.py

  wheels:
    name: Wheels ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15-intel builds the x86_64 wheel natively, so its tests run.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # On a pull request that touches the library, its tests or the build, the
  # aarch64 wheel as the release builds and tests it. Of the five wheels it is
  # the one built by GCC for a CPU with FMA: before -ffp-contract=off, GCC's
  # contraction made its results depend on the thread count, which only the
  # TestPyPI dry run for 1.0.0rc2 found (#105). The release matrix above
  # builds every wheel on tags and manual runs.
  wheel-arm:
    name: Wheel ubuntu-24.04-arm (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Changes to the library, its tests or the build
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" |
             grep -qE '^(src/|include/|bindings/|tests/python/|CMakeLists\.txt$|pyproject\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No library or build changes: the aarch64 wheel is not built."
          fi
      - if: steps.changes.outputs.build == 'true'
        uses: pypa/cibuildwheel@v3.1

  sdist:
    name: Source distribution
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --sdist
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(tar xzf dist/*.tar.gz -O --wildcards '*/PKG-INFO' | sed -n 's/^Version: //p')
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Trusted publishing (OIDC): no API tokens are stored in the repository.
  # The publishers are registered on PyPI and TestPyPI for this workflow file
  # and these environment names.
  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [c, sanitizers, tsan, valgrind, abi, python, wheels, sdist]
    runs-on: ubuntu-latest
    environment: { name: testpypi, url: "https://test.pypi.org/p/fastprox" }
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { repository-url: "https://test.pypi.org/legacy/" }

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [c, sanitizers, tsan, valgrind, abi, python, wheels, sdist]
    runs-on: ubuntu-latest
    environment: { name: pypi, url: "https://pypi.org/p/fastprox" }
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
