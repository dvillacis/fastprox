name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"  # nightly
  workflow_dispatch:

jobs:
  libfuzzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build
        env: { CC: clang, CXX: clang++ }
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFASTPROX_FUZZ=ON \
                -DFASTPROX_SANITIZE=ON -DFASTPROX_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build --target fuzz_ops
      - name: Fuzz for 20 minutes
        run: |
          mkdir -p corpus
          ./build/fuzz/fuzz_ops corpus -max_total_time=1200 -timeout=10 -rss_limit_mb=4096 \
            -max_len=8192 -print_final_stats=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            leak-*
